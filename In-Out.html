<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舖收支管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-lg mx-auto p-4">
    <!-- 標題 + 版本 -->
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-xl font-bold text-gray-800">店舖收支管理</h1>
          <p class="text-gray-500 text-xs mt-0.5">Million Fishball Noodle · 本地儲存</p>
        </div>
        <span class="bg-blue-100 text-blue-700 text-xs font-medium px-2 py-1 rounded">v1.0.4</span>
      </div>
    </div>

    <!-- 導航 -->
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      <button onclick="showSection('dashboard')" id="btn-dashboard" class="nav-btn px-3 py-2 rounded-lg bg-blue-600 text-white font-medium text-sm whitespace-nowrap">總覽</button>
      <button onclick="showSection('income')" id="btn-income" class="nav-btn px-3 py-2 rounded-lg bg-white text-gray-700 font-medium text-sm whitespace-nowrap">新增收入</button>
      <button onclick="showSection('expense')" id="btn-expense" class="nav-btn px-3 py-2 rounded-lg bg-white text-gray-700 font-medium text-sm whitespace-nowrap">新增支出</button>
      <button onclick="showSection('list')" id="btn-list" class="nav-btn px-3 py-2 rounded-lg bg-white text-gray-700 font-medium text-sm whitespace-nowrap">紀錄列表</button>
    </div>

    <!-- ===== 總覽 ===== -->
    <div id="section-dashboard" class="space-y-4">
      <div class="bg-white rounded-xl shadow p-3 flex flex-wrap items-center gap-2">
        <label class="font-medium text-gray-700 text-sm">查看日期：</label>
        <input type="date" id="view-date" class="border rounded-lg px-2 py-1.5 text-sm" onchange="updateDashboard()">
        <button onclick="setToday()" class="text-xs text-blue-600 underline">今天</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">本日收入</div>
          <div id="today-income" class="text-lg font-bold text-green-600">$0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">本日支出</div>
          <div id="today-expense" class="text-lg font-bold text-red-600">$0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">本日盈虧</div>
          <div id="today-profit" class="text-lg font-bold">$0</div>
        </div>
        <div class="bg-blue-50 rounded-xl shadow p-3 border border-blue-200">
          <div class="text-xs text-blue-600 font-medium">本月盈虧</div>
          <div id="month-profit" class="text-lg font-bold">$0</div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">貨品</div>
          <div id="cat-goods" class="text-base font-bold text-orange-600">$0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">員工</div>
          <div id="cat-salary" class="text-base font-bold text-orange-600">$0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">NETS</div>
          <div id="method-nets" class="text-base font-bold text-blue-600">$0</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3">
          <div class="text-xs text-gray-500">CDC</div>
          <div id="method-cdc" class="text-base font-bold text-blue-600">$0</div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <h3 class="font-bold mb-2 text-sm">收入 vs 支出</h3>
        <canvas id="ratioChart" height="180"></canvas>
        <p id="ratio-text" class="text-center text-xs text-gray-500 mt-1"></p>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <h3 class="font-bold mb-2 text-sm">每日收支對比</h3>
        <canvas id="dailyChart" height="180"></canvas>
      </div>

      <!-- 匯入 / 匯出 -->
      <div class="bg-white rounded-xl shadow p-4 space-y-3">
        <button onclick="exportExcel()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-medium">
          下載 Excel 備份
        </button>
        <div>
          <label class="block text-sm text-gray-600 mb-1">匯入 Excel 還原資料</label>
          <input type="file" id="import-file" accept=".xlsx, .xls" class="w-full text-sm" onchange="importExcel(event)">
        </div>
        <p class="text-xs text-gray-500">建議定期下載 Excel 備份。換手機或清除資料後，可用匯入功能還原。</p>
      </div>
    </div>

    <!-- ===== 新增收入 ===== -->
    <div id="section-income" class="hidden">
      <div class="bg-white rounded-xl shadow p-4">
        <!-- 日期 -->
        <div class="flex items-center justify-between mb-3">
          <div class="border-2 border-gray-800 rounded-lg px-4 py-1.5 font-bold text-lg" id="income-date-display">--</div>
          <input type="date" id="income-date" class="border rounded-lg px-2 py-1.5 text-sm" onchange="updateIncomeDateDisplay()">
        </div>

        <!-- 每日總結 -->
        <div class="bg-blue-50 rounded-lg p-3 mb-4 border border-blue-100">
          <div class="text-sm font-bold text-blue-800 mb-2">每日總結</div>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div>總收入：<span id="daily-total" class="font-bold text-green-600">$0</span></div>
            <div>現金：<span id="sum-cash" class="font-bold">$0</span></div>
            <div>CDC：<span id="sum-cdc" class="font-bold">$0</span></div>
            <div>Nets：<span id="sum-nets" class="font-bold">$0</span></div>
            <div class="col-span-2">外賣平台：<span id="sum-delivery" class="font-bold">$0</span></div>
          </div>
        </div>

        <!-- 早 -->
        <div class="mb-5 border rounded-lg p-3">
          <div class="flex justify-between items-center mb-2">
            <div class="font-bold text-gray-700">早</div>
            <div class="text-sm">小計：<span id="sub-morning" class="font-bold text-green-600">$0</span></div>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-2">
            <div>
              <label class="text-xs text-gray-500">現金</label>
              <input type="number" id="cash-morning" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-gray-500">CDC</label>
              <input type="number" id="cdc-morning" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-gray-500">Nets</label>
              <input type="number" id="nets-morning" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-xs text-gray-500">外賣平台</label>
              <input type="number" id="delivery-morning" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-yellow-600">魚圓</label>
              <input type="number" id="fishball-morning" class="w-full border rounded-lg px-2 py-2 text-center bg-yellow-50" placeholder="0">
            </div>
            <div>
              <label class="text-xs text-yellow-600">肉圓</label>
              <input type="number" id="meatball-morning" class="w-full border rounded-lg px-2 py-2 text-center bg-yellow-50" placeholder="0">
            </div>
          </div>
        </div>

        <!-- 午 -->
        <div class="mb-5 border rounded-lg p-3">
          <div class="flex justify-between items-center mb-2">
            <div class="font-bold text-gray-700">午</div>
            <div class="text-sm">小計：<span id="sub-afternoon" class="font-bold text-green-600">$0</span></div>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-2">
            <div>
              <label class="text-xs text-gray-500">現金</label>
              <input type="number" id="cash-afternoon" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-gray-500">CDC</label>
              <input type="number" id="cdc-afternoon" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-gray-500">Nets</label>
              <input type="number" id="nets-afternoon" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-xs text-gray-500">外賣平台</label>
              <input type="number" id="delivery-afternoon" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-yellow-600">魚圓</label>
              <input type="number" id="fishball-afternoon" class="w-full border rounded-lg px-2 py-2 text-center bg-yellow-50" placeholder="0">
            </div>
            <div>
              <label class="text-xs text-yellow-600">肉圓</label>
              <input type="number" id="meatball-afternoon" class="w-full border rounded-lg px-2 py-2 text-center bg-yellow-50" placeholder="0">
            </div>
          </div>
        </div>

        <!-- 夜 -->
        <div class="mb-5 border rounded-lg p-3">
          <div class="flex justify-between items-center mb-2">
            <div class="font-bold text-gray-700">夜</div>
            <div class="text-sm">小計：<span id="sub-night" class="font-bold text-green-600">$0</span></div>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-2">
            <div>
              <label class="text-xs text-gray-500">現金</label>
              <input type="number" id="cash-night" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-gray-500">CDC</label>
              <input type="number" id="cdc-night" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-gray-500">Nets</label>
              <input type="number" id="nets-night" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-xs text-gray-500">外賣平台</label>
              <input type="number" id="delivery-night" class="w-full border rounded-lg px-2 py-2 text-center" placeholder="0" oninput="calcTotals()">
            </div>
            <div>
              <label class="text-xs text-yellow-600">魚圓</label>
              <input type="number" id="fishball-night" class="w-full border rounded-lg px-2 py-2 text-center bg-yellow-50" placeholder="0">
            </div>
            <div>
              <label class="text-xs text-yellow-600">肉圓</label>
              <input type="number" id="meatball-night" class="w-full border rounded-lg px-2 py-2 text-center bg-yellow-50" placeholder="0">
            </div>
          </div>
        </div>

        <button onclick="saveIncomeForm()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold text-lg">
          儲存
        </button>
      </div>
    </div>

    <!-- ===== 新增支出 ===== -->
    <div id="section-expense" class="hidden">
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="text-lg font-bold mb-4">新增支出</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">日期</label>
            <input type="date" id="expense-date" class="w-full border rounded-lg px-3 py-2.5">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">金額</label>
            <input type="number" id="expense-amount" placeholder="0" class="w-full border rounded-lg px-3 py-2.5 text-lg">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">分類</label>
            <select id="expense-category" class="w-full border rounded-lg px-3 py-2.5">
              <option value="進貨">進貨（貨品）</option>
              <option value="租金">租金</option>
              <option value="水電煤">水電煤</option>
              <option value="薪金">薪金（員工）</option>
              <option value="外賣平台抽成">外賣平台抽成</option>
              <option value="雜項">雜項</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">備註</label>
            <input type="text" id="expense-note" placeholder="選填" class="w-full border rounded-lg px-3 py-2.5">
          </div>
          <button onclick="addExpense()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-bold">儲存支出</button>
        </div>
      </div>
    </div>

    <!-- ===== 紀錄列表 ===== -->
    <div id="section-list" class="hidden">
      <div class="bg-white rounded-xl shadow p-4 mb-4">
        <h2 class="text-lg font-bold mb-3">收入紀錄</h2>
        <div id="income-list" class="space-y-2 text-sm"></div>
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <h2 class="text-lg font-bold mb-3">支出紀錄</h2>
        <div id="expense-list" class="space-y-2 text-sm"></div>
      </div>
    </div>
  </div>

  <script>
    let incomes = JSON.parse(localStorage.getItem('incomes') || '{}');
    let expenses = JSON.parse(localStorage.getItem('expenses') || '{}');
    let dailyChart = null;
    let ratioChart = null;

    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('income-date').value = today;
    document.getElementById('expense-date').value = today;
    document.getElementById('view-date').value = today;
    updateIncomeDateDisplay();
    updateUI();

    function saveData() {
      localStorage.setItem('incomes', JSON.stringify(incomes));
      localStorage.setItem('expenses', JSON.stringify(expenses));
    }

    function updateIncomeDateDisplay() {
      const dateVal = document.getElementById('income-date').value;
      if (!dateVal) return;
      const d = new Date(dateVal);
      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('income-date-display').textContent = `${d.getDate()} ${monthNames[d.getMonth()]}`;
    }

    function setToday() {
      document.getElementById('view-date').value = today;
      updateDashboard();
    }

    function showSection(name) {
      ['dashboard', 'income', 'expense', 'list'].forEach(s => {
        document.getElementById('section-' + s).classList.add('hidden');
        document.getElementById('btn-' + s).classList.remove('bg-blue-600', 'text-white');
        document.getElementById('btn-' + s).classList.add('bg-white', 'text-gray-700');
      });
      document.getElementById('section-' + name).classList.remove('hidden');
      document.getElementById('btn-' + name).classList.add('bg-blue-600', 'text-white');
      document.getElementById('btn-' + name).classList.remove('bg-white', 'text-gray-700');
    }

    function calcTotals() {
      const periods = ['morning', 'afternoon', 'night'];
      let totalCash = 0, totalCdc = 0, totalNets = 0, totalDelivery = 0, grandTotal = 0;

      periods.forEach(p => {
        const cash = parseFloat(document.getElementById(`cash-${p}`).value) || 0;
        const cdc = parseFloat(document.getElementById(`cdc-${p}`).value) || 0;
        const nets = parseFloat(document.getElementById(`nets-${p}`).value) || 0;
        const delivery = parseFloat(document.getElementById(`delivery-${p}`).value) || 0;
        const sub = cash + cdc + nets + delivery;
        document.getElementById(`sub-${p}`).textContent = '$' + sub.toLocaleString();
        totalCash += cash; totalCdc += cdc; totalNets += nets; totalDelivery += delivery; grandTotal += sub;
      });

      document.getElementById('daily-total').textContent = '$' + grandTotal.toLocaleString();
      document.getElementById('sum-cash').textContent = '$' + totalCash.toLocaleString();
      document.getElementById('sum-cdc').textContent = '$' + totalCdc.toLocaleString();
      document.getElementById('sum-nets').textContent = '$' + totalNets.toLocaleString();
      document.getElementById('sum-delivery').textContent = '$' + totalDelivery.toLocaleString();
    }

    function saveIncomeForm() {
      const date = document.getElementById('income-date').value;
      if (!date) return alert('請選擇日期');

      const periods = [
        { key: 'morning', name: '早' },
        { key: 'afternoon', name: '午' },
        { key: 'night', name: '夜' }
      ];
      const methods = [
        { id: 'cash', name: '現金' },
        { id: 'cdc', name: 'CDC' },
        { id: 'nets', name: 'NETS' },
        { id: 'delivery', name: '外賣平台' }
      ];

      let saveCount = 0;
      periods.forEach(period => {
        methods.forEach(method => {
          const amount = parseFloat(document.getElementById(`${method.id}-${period.key}`).value) || 0;
          if (amount > 0) {
            const id = Date.now() + Math.random().toString(36).slice(2, 8);
            incomes[id] = {
              date, amount,
              method: method.name,
              period: period.name,
              note: period.name + '時段',
              createdAt: Date.now()
            };
            saveCount++;
          }
        });
      });

      if (saveCount === 0) return alert('請至少填寫一筆金額');

      saveData();
      alert(`成功儲存 ${saveCount} 筆收入！`);
      periods.forEach(p => {
        ['cash','cdc','nets','delivery','fishball','meatball'].forEach(id => {
          document.getElementById(`${id}-${p.key}`).value = '';
        });
      });
      calcTotals();
      updateUI();
    }

    function addExpense() {
      const date = document.getElementById('expense-date').value;
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const category = document.getElementById('expense-category').value;
      const note = document.getElementById('expense-note').value;

      if (!date || !amount || amount <= 0) return alert('請填寫日期和金額');

      const id = Date.now() + Math.random().toString(36).slice(2, 8);
      expenses[id] = { date, amount, category, note, createdAt: Date.now() };
      saveData();
      alert('支出已儲存！');
      document.getElementById('expense-amount').value = '';
      document.getElementById('expense-note').value = '';
      updateUI();
    }

    function updateUI() {
      renderLists();
      updateDashboard();
    }

    function renderLists() {
      const incomeArr = Object.entries(incomes).sort((a,b) => b[1].createdAt - a[1].createdAt);
      document.getElementById('income-list').innerHTML = incomeArr.length === 0 
        ? '<p class="text-gray-400">目前沒有收入紀錄</p>'
        : incomeArr.map(([id, item]) => `
          <div class="flex justify-between items-center border-b py-2">
            <div>
              <span class="font-medium">${item.date}</span> · 
              <span class="text-green-600 font-bold">$${Number(item.amount).toLocaleString()}</span>
              <div class="text-xs text-gray-500">${item.method} ${item.period || ''}</div>
            </div>
            <button onclick="deleteIncome('${id}')" class="text-red-500 text-xs">刪除</button>
          </div>`).join('');

      const expenseArr = Object.entries(expenses).sort((a,b) => b[1].createdAt - a[1].createdAt);
      document.getElementById('expense-list').innerHTML = expenseArr.length === 0 
        ? '<p class="text-gray-400">目前沒有支出紀錄</p>'
        : expenseArr.map(([id, item]) => `
          <div class="flex justify-between items-center border-b py-2">
            <div>
              <span class="font-medium">${item.date}</span> · 
              <span class="text-red-600 font-bold">$${Number(item.amount).toLocaleString()}</span>
              <div class="text-xs text-gray-500">${item.category}</div>
            </div>
            <button onclick="deleteExpense('${id}')" class="text-red-500 text-xs">刪除</button>
          </div>`).join('');
    }

    function deleteIncome(id) {
      if (confirm('確定刪除？')) {
        delete incomes[id];
        saveData();
        updateUI();
      }
    }
    function deleteExpense(id) {
      if (confirm('確定刪除？')) {
        delete expenses[id];
        saveData();
        updateUI();
      }
    }

    function updateDashboard() {
      const viewDate = document.getElementById('view-date').value || today;
      const currentMonth = viewDate.slice(0, 7);

      let todayIncome = 0, todayExpense = 0, monthIncome = 0, monthExpense = 0;
      let nets = 0, cdc = 0, goods = 0, salary = 0;
      const dailyMap = {};

      Object.values(incomes).forEach(item => {
        if (!item.date) return;
        const amt = Number(item.amount) || 0;
        if (item.date === viewDate) {
          todayIncome += amt;
          if (item.method === 'NETS') nets += amt;
          if (item.method === 'CDC') cdc += amt;
        }
        if (item.date.startsWith(currentMonth)) {
          monthIncome += amt;
          if (!dailyMap[item.date]) dailyMap[item.date] = { income: 0, expense: 0 };
          dailyMap[item.date].income += amt;
        }
      });

      Object.values(expenses).forEach(item => {
        if (!item.date) return;
        const amt = Number(item.amount) || 0;
        if (item.date === viewDate) {
          todayExpense += amt;
          if (item.category.includes('進貨')) goods += amt;
          if (item.category.includes('薪金')) salary += amt;
        }
        if (item.date.startsWith(currentMonth)) {
          monthExpense += amt;
          if (!dailyMap[item.date]) dailyMap[item.date] = { income: 0, expense: 0 };
          dailyMap[item.date].expense += amt;
        }
      });

      document.getElementById('today-income').textContent = '$' + todayIncome.toLocaleString();
      document.getElementById('today-expense').textContent = '$' + todayExpense.toLocaleString();

      const tp = document.getElementById('today-profit');
      const todayProfit = todayIncome - todayExpense;
      tp.textContent = '$' + todayProfit.toLocaleString();
      tp.className = 'text-lg font-bold ' + (todayProfit >= 0 ? 'text-green-600' : 'text-red-600');

      const mp = document.getElementById('month-profit');
      const monthProfit = monthIncome - monthExpense;
      mp.textContent = '$' + monthProfit.toLocaleString();
      mp.className = 'text-lg font-bold ' + (monthProfit >= 0 ? 'text-green-600' : 'text-red-600');

      document.getElementById('cat-goods').textContent = '$' + goods.toLocaleString();
      document.getElementById('cat-salary').textContent = '$' + salary.toLocaleString();
      document.getElementById('method-nets').textContent = '$' + nets.toLocaleString();
      document.getElementById('method-cdc').textContent = '$' + cdc.toLocaleString();

      renderRatioChart(monthIncome, monthExpense);
      renderDailyChart(dailyMap, viewDate);
    }

    function renderRatioChart(income, expense) {
      if (ratioChart) ratioChart.destroy();
      ratioChart = new Chart(document.getElementById('ratioChart'), {
        type: 'doughnut',
        data: {
          labels: ['收入', '支出'],
          datasets: [{ data: [income, expense], backgroundColor: ['#22c55e', '#ef4444'] }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
      });
      document.getElementById('ratio-text').textContent = 
        (income === 0 && expense === 0) ? '目前沒有資料' :
        (expense === 0) ? '收入 : 支出 = ∞ : 0' :
        `收入 : 支出 ≈ ${(income / expense).toFixed(2)} : 1`;
    }

    function renderDailyChart(dailyMap, viewDate) {
      const dates = Object.keys(dailyMap).filter(d => d <= viewDate).sort().reverse();
      if (dates.length === 0) dates.push(viewDate);

      if (dailyChart) dailyChart.destroy();
      dailyChart = new Chart(document.getElementById('dailyChart'), {
        type: 'bar',
        data: {
          labels: dates.map(d => d.slice(8) + '日'),
          datasets: [
            { label: '收入', data: dates.map(d => dailyMap[d]?.income || 0), backgroundColor: '#22c55e' },
            { label: '支出', data: dates.map(d => dailyMap[d]?.expense || 0), backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'top' } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // 匯出 Excel
    function exportExcel() {
      const incomeData = Object.values(incomes).map(i => ({
        類型: '收入', 日期: i.date, 金額: i.amount, 方式: i.method, 時段: i.period || '', 備註: i.note || ''
      }));
      const expenseData = Object.values(expenses).map(e => ({
        類型: '支出', 日期: e.date, 金額: e.amount, 方式: e.category, 時段: '', 備註: e.note || ''
      }));
      const allData = [...incomeData, ...expenseData];
      if (allData.length === 0) return alert('目前沒有資料可匯出');
      const ws = XLSX.utils.json_to_sheet(allData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '收支紀錄');
      XLSX.writeFile(wb, '店舖收支_' + new Date().toISOString().slice(0,10) + '.xlsx');
    }

    // 匯入 Excel
    function importExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);

          let incomeCount = 0, expenseCount = 0;

          json.forEach(row => {
            const type = row['類型'] || row['类型'] || '';
            const date = row['日期'] || '';
            const amount = parseFloat(row['金額'] || row['金额'] || 0);
            if (!date || !amount) return;

            const id = Date.now() + Math.random().toString(36).slice(2, 8);

            if (type.includes('收入')) {
              incomes[id] = {
                date: String(date).slice(0, 10),
                amount,
                method: row['方式'] || '',
                period: row['時段'] || row['时段'] || '',
                note: row['備註'] || row['备注'] || '',
                createdAt: Date.now()
              };
              incomeCount++;
            } else if (type.includes('支出')) {
              expenses[id] = {
                date: String(date).slice(0, 10),
                amount,
                category: row['方式'] || '',
                note: row['備註'] || row['备注'] || '',
                createdAt: Date.now()
              };
              expenseCount++;
            }
          });

          saveData();
          updateUI();
          alert(`匯入成功！\n收入：${incomeCount} 筆\n支出：${expenseCount} 筆`);
          event.target.value = '';
        } catch (err) {
          alert('匯入失敗，請確認是本系統匯出的 Excel 檔案');
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
